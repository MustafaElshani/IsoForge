[package]
name = "isoforge_core"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "IsoForge is a hypergraph-based tool for long-read RNA-seq: it keeps every read whole to discover isoforms with their start and poly(A) sites, count them, and call gene fusions, all in one run."
license = "MIT"

[lib]
name = "isoforge_core"
crate-type = ["cdylib", "rlib"]
path = "rust_core/src/lib.rs"

[dependencies]
# abi3: one wheel per platform serves every Python from 3.10 on
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# htslib without remote-file support: alignments and FASTA files are read from disk
rust-htslib = { version = "0.47", default-features = false, features = ["static", "bzip2", "lzma"] }
minimap2-sys = "=0.1.30"
hts-sys = { version = "=2.2.0", default-features = false, features = ["bzip2", "lzma"] }
arrow = { version = "53", features = ["prettyprint"] }
parquet = { version = "53", features = ["arrow", "snap", "zstd"] }
rayon = "1.10"
crossbeam = "0.8"
rustc-hash = "2.0"
ahash = "0.8"
coitrees = "0.4"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the thresholds of the admission model are read back as the exact doubles that were written
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
flate2 = "1.0"
parking_lot = "0.12"
dashmap = "6"
csv = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["disable_initial_exec_tls"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
rust-htslib = { path = "vendor/rust-htslib-0.47.1-patched" }
minimap2-sys = { path = "vendor/minimap2-sys-0.1.30-mm230" }
